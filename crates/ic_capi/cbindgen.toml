language = "C"
include_guard = "IC_APID_H"
include_version = true
cpp_compat = true
style = "type"
usize_is_size_t = true
documentation = true
documentation_style = "c"
line_length = 80
tab_width = 2
header = """/* iClaustron Data API — C header.
 * Generated by cbindgen from crates/ic_capi; do not edit by hand.
 * Run `cargo xtask header` to check it, and see doc/rust/04-api-design.md,
 * "The C ABI", for the rules every function follows.
 * Copyright (c) 2026 Hopsworks and/or its affiliates.
 * Licensed under the MIT License. See LICENSE in the repository root. */"""

after_includes = """

/*
 * How every function behaves
 * --------------------------
 *
 * Results. A function that can fail returns 0, or an error code; what
 * it makes it gives through an out pointer, written only when it
 * returns 0. ic_error_message() gives a code's text, and
 * ic_error_is_temporary() whether to try again (doc/user-guide.md,
 * "When to try again"). Codes from 7000 up are iClaustron's (the
 * IC_ERROR_* defines below name those a program checks), small positive
 * codes the operating system's, the others NDB's (IC_NDB_ERROR_*).
 * Each function's "Errors" names the codes particular to it. Any
 * function that talks to the cluster may also fail as the cluster
 * does: IC_ERROR_LINK_LOST, IC_ERROR_NO_STARTED_DATA_NODE,
 * IC_ERROR_TIMEOUT, or one of NDB's temporary errors.
 *
 * Handles. IC_APID_GLOBAL, IC_APID_CONNECTION, IC_TABLE_DEF,
 * IC_INDEX_DEF, IC_RECORD, IC_APID_EXECUTOR, IC_APID_SUBMITTER,
 * IC_OP_SHAPE, IC_REQUEST, IC_SCAN_SHAPE and IC_SCAN_READER are made by
 * one function and given back to their _free; the caller owns each
 * until then. A connection, and an executor, is freed before its
 * global; a table, index or record handle may outlive the connection
 * that made it, a query or scan keeps what it needs of its records, and
 * a request or reader what it needs of its shapes. A NULL
 * handle or out pointer gives IC_ERROR_NULL_POINTER; a handle freed, or
 * never made, is undefined behaviour.
 *
 * Ids. A query (IC_QUERY_ID), a transaction (IC_TRANS_ID) and a scan
 * (IC_SCAN_ID) are named by an id in their connection, and a scan's
 * batch by an IC_SCAN_BATCH_ID. An id that names nothing any more,
 * freed, closed or handed back, is refused with an error or passed
 * over, never followed.
 *
 * Rows. A query owns its rows: ic_apid_query_key_row() and
 * ic_apid_query_attr_row() give pointers valid until the query is
 * freed, aligned to a byte and no more, so copy a struct in and out
 * with memcpy. The program fills the rows before it defines the query
 * and reads the attribute row once it has completed; between the two
 * they are the library's. A request's operations own their rows the
 * same way (ic_request_key_row(), ic_request_attr_row()), valid until
 * the request is freed or cleared, and the library's while it runs.
 * A scan, and a scan reader, owns its row (ic_apid_scan_row(),
 * ic_scan_reader_row()), valid until it is freed and overwritten by
 * each row read; the _into calls read into the program's row instead.
 * The synchronous calls take the program's own rows, and copy.
 *
 * Strings. Strings in are NUL-terminated UTF-8, and copied. A string
 * out, a table's or a field's name, lives as long as the handle it came
 * from; an error's text is copied into the caller's buffer.
 *
 * Structs with a size. IC_GLOBAL_OPTIONS, IC_EXECUTOR_OPTIONS,
 * IC_READ_KEY_ARGS, IC_WRITE_KEY_ARGS, IC_SCAN_ARGS and
 * IC_TAKEOVER_ARGS are filled by their _init(&s, sizeof s) before the
 * program sets what it wants;
 * IC_FIELD_INFO and IC_EXECUTOR_STATS are given with their size. A
 * later release adds fields at the end, and a program built against an
 * older header gets the fields it knows: IC_EXECUTOR_OPTIONS and
 * IC_EXECUTOR_STATS gained `scans` after 0.1.
 *
 * Threads. The functions that take no handle (ic_api_version,
 * ic_error_*, ic_field_type_name, the _init functions) may be called
 * from any thread. So may those on a global, and on table, index and
 * record handles, at the same time, except their _free. A connection,
 * with its queries and transactions, is used by one thread at a time;
 * it may change threads between calls. A callback runs on the thread
 * that polls, inside the poll.
 *
 * Executors. A thread with no connection of its own runs key
 * operations through an executor: a thread of the library's, with a
 * connection, that runs the requests of any number of threads and
 * sends together whatever it admits at once. Each thread makes its own
 * submitter (ic_apid_executor_submitter()), binds tables through it,
 * describes its operations once as shapes (ic_op_shape_create()), and
 * runs a request, a transaction of operations, with
 * ic_apid_submitter_execute(), which blocks until the transaction has
 * ended. An executor, its shapes and its stats may be used from any
 * thread; a submitter and a request by one at a time.
 *
 * Scans. A scan reads a table in batches, one receiver per fragment
 * scanned at once. On a connection: ic_apid_scan_create() once,
 * ic_apid_conn_start_scan() for each run, and the rows read either
 * row by row with ic_apid_conn_next_row(), which polls while it waits,
 * or a batch at a time, from the ready list or a callback, each batch
 * handed back with ic_apid_conn_release_scan_batch(). A receiver is
 * asked for more only once its batch is handed back, so the program
 * sets the pace, and a locking scan's rows stay locked until then.
 * A locking scan started on a transaction may hand the row last read
 * over to it: ic_apid_conn_lock_scan_row(), _update_scan_row() and
 * _delete_scan_row() define a query that takes the row's lock, and its
 * batch asks for more only once every such query of it has completed.
 * Through an executor: a scan shape (ic_scan_shape_create()), a reader
 * of it (ic_scan_reader_create()), ic_apid_submitter_scan() to run it,
 * and ic_scan_reader_next_row(), which waits for the executor. A slow
 * reader stalls only its own scan.
 *
 * Panics. A panic inside the library returns IC_ERROR_INTERNAL_PANIC;
 * the connection it went through is unusable from then on, and every
 * call on it but its _free returns the same.
 *
 * "Safety". Each function's Safety paragraph says what its pointers
 * must be: the conditions on a C caller, as the Rust the library is
 * written in names them.
 */
"""

[export]
prefix = ""
# Named in the argument structs only by their shape; exported by name too.
include = ["IcApidCallback", "IcScanCallback"]

# The Rust names are CamelCase; the C ones are the header's.
[export.rename]
"IcApidGlobal" = "IC_APID_GLOBAL"
"IcApidConnection" = "IC_APID_CONNECTION"
"IcTableDef" = "IC_TABLE_DEF"
"IcIndexDef" = "IC_INDEX_DEF"
"IcRecord" = "IC_RECORD"
"IcQueryId" = "IC_QUERY_ID"
"IcTransId" = "IC_TRANS_ID"
"IcApidCallback" = "IC_APID_CALLBACK"
"IcGlobalOptions" = "IC_GLOBAL_OPTIONS"
"IcFieldSpec" = "IC_FIELD_SPEC"
"IcFieldInfo" = "IC_FIELD_INFO"
"IcReadKeyArgs" = "IC_READ_KEY_ARGS"
"IcWriteKeyArgs" = "IC_WRITE_KEY_ARGS"
"IcTransactionHint" = "IC_TRANSACTION_HINT"
"IcApidExecutor" = "IC_APID_EXECUTOR"
"IcApidSubmitter" = "IC_APID_SUBMITTER"
"IcOpShape" = "IC_OP_SHAPE"
"IcRequest" = "IC_REQUEST"
"IcExecutorOptions" = "IC_EXECUTOR_OPTIONS"
"IcExecutorStats" = "IC_EXECUTOR_STATS"
"IcScanId" = "IC_SCAN_ID"
"IcScanBatchId" = "IC_SCAN_BATCH_ID"
"IcScanCallback" = "IC_SCAN_CALLBACK"
"IcScanArgs" = "IC_SCAN_ARGS"
"IcScanRange" = "IC_SCAN_RANGE"
"IcScanShape" = "IC_SCAN_SHAPE"
"IcScanReader" = "IC_SCAN_READER"
"IcTakeoverArgs" = "IC_TAKEOVER_ARGS"

[enum]
prefix_with_name = false
rename_variants = "ScreamingSnakeCase"
